
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8ef">
<title>Ma Routine</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px 16px 40px;
  font-family: -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
  background: #fff8ef;
  color: #303044;
}
main { max-width: 620px; margin: auto; }
h1 { text-align: center; font-size: 32px; margin-bottom: 5px; }
.subtitle { text-align: center; color: #777; margin-top: 0; }
h2 { font-size: 20px; margin-top: 28px; }
.panel {
  background: white;
  padding: 18px;
  border-radius: 22px;
  box-shadow: 0 4px 18px #0000000b;
  margin-top: 18px;
}
.clock {
  width: min(78vw, 310px);
  aspect-ratio: 1;
  border-radius: 50%;
  margin: 20px auto;
  display: grid;
  place-items: center;
  background: conic-gradient(#e9e9e9 0deg 360deg);
  position: relative;
}
.clock::before {
  content: "";
  position: absolute;
  inset: 13px;
  border-radius: 50%;
  background: conic-gradient(
    from -90deg,
    transparent var(--progress),
    #ffffffb8 var(--progress) 360deg
  );
}
.center {
  z-index: 1;
  background: white;
  width: 55%;
  height: 55%;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  box-shadow: 0 2px 12px #00000012;
  padding: 10px;
}
#time { font-size: 31px; font-weight: 800; }
#current { font-size: 14px; margin-top: 5px; }
#status { text-align: center; color: #777; min-height: 22px; }
button {
  border: 0;
  border-radius: 14px;
  padding: 12px 17px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.primary { background: #7768d8; color: white; }
.secondary { background: #eeeaff; color: #5143a5; }
.danger { background: #fff0ed; color: #b84e40; }
.actions { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }
.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}
.swatch { width: 19px; height: 19px; border-radius: 7px; flex-shrink: 0; }
.task-name { flex: 1; min-width: 0; font-weight: 650; }
.task input {
  width: 65px;
  padding: 8px 5px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
}
.task button { padding: 8px 10px; }
.field { margin: 10px 0; }
label { display: block; font-size: 14px; margin-bottom: 6px; color: #666; }
input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 11px;
  font-size: 16px;
  background: white;
}
.addrow { display: grid; grid-template-columns: 1fr 95px; gap: 9px; }
.addrow input { min-width: 0; }
#add { width: 100%; margin-top: 10px; }
.total { text-align: center; color: #777; font-size: 14px; }
.small { color: #888; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>🌈 Ma Routine</h1>
  <p class="subtitle">Chaque étape compte !</p>

  <section class="panel">
    <h2 style="text-align:center;margin-top:0">Ma routine du jour</h2>
    <div class="clock" id="clock" style="--progress:0deg">
      <div class="center">
        <div id="time">00:00</div>
        <div id="current">Prêt à commencer !</div>
      </div>
    </div>
    <p id="status">Ajoute tes activités puis démarre.</p>
    <p class="total" id="total">Durée totale : 0 min</p>
    <div class="actions">
      <button class="primary" id="start">▶ Démarrer</button>
      <button class="secondary" id="pause">Ⅱ Pause</button>
      <button class="danger" id="reset">↺ Recommencer</button>
    </div>
  </section>

  <section class="panel">
    <h2 style="margin-top:0">Mes activités</h2>
    <div id="tasks"></div>
    <p class="small">Modifie les durées directement dans la liste.</p>
  </section>

  <section class="panel">
    <h2 style="margin-top:0">Ajouter une activité</h2>
    <div class="field">
      <label for="newName">Nom de l'activité</label>
      <input id="newName" placeholder="Ex. : Se brosser les dents">
    </div>
    <div class="field">
      <label for="newDuration">Durée en minutes</label>
      <div class="addrow">
        <input id="newDuration" type="number" min="1" max="240" value="5">
        <input id="newColor" type="color" value="#a9d8f5" aria-label="Couleur">
      </div>
    </div>
    <button class="primary" id="add">＋ Ajouter l'activité</button>
  </section>
</main>

<script>
const initialTasks = [
  {name:"Se réveiller", minutes:5, color:"#f8c66b"},
  {name:"S'habiller", minutes:10, color:"#a9d8f5"},
  {name:"Prendre le petit-déjeuner", minutes:15, color:"#b9dfad"},
  {name:"Se brosser les dents", minutes:3, color:"#d9c5f4"},
  {name:"Mettre ses chaussures", minutes:5, color:"#f3b5bd"}
];

let tasks = JSON.parse(localStorage.getItem("maRoutineTasks") || "null") || initialTasks;
let elapsed = 0;
let running = false;
let lastTick = null;
let timer = null;

const $ = id => document.getElementById(id);

function totalSeconds() {
  return tasks.reduce((sum, task) => sum + task.minutes * 60, 0);
}

function save() {
  localStorage.setItem("maRoutineTasks", JSON.stringify(tasks));
}

function format(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function currentTask() {
  let position = elapsed;
  for (let i = 0; i < tasks.length; i++) {
    const duration = tasks[i].minutes * 60;
    if (position < duration) return tasks[i];
    position -= duration;
  }
  return null;
}

function draw() {
  const total = totalSeconds();
  const progress = total ? Math.min(360, elapsed / total * 360) : 0;
  let angle = 0;
  const pieces = tasks.map(task => {
    const next = angle + (total ? task.minutes * 60 / total * 360 : 0);
    const piece = `${task.color} ${angle}deg ${next}deg`;
    angle = next;
    return piece;
  });

  $("clock").style.background = pieces.length
    ? `conic-gradient(from -90deg, ${pieces.join(",")})`
    : "#eee";

  $("clock").style.setProperty("--progress", progress + "deg");
  $("time").textContent = format(total - elapsed);

  const active = currentTask();
  $("current").textContent = active ? active.name :
    (total ? "Routine terminée !" : "Ajoute des activités");

  $("total").textContent = "Durée totale : " +
    Math.ceil(total / 60) + " min";

  if (!total) $("status").textContent = "Ajoute tes activités pour commencer.";
  else if (elapsed >= total) $("status").textContent = "Bravo ! Routine terminée 🎉";
  else if (running) $("status").textContent = "C'est parti !";
  else if (elapsed > 0) $("status").textContent = "Routine en pause.";
  else $("status").textContent = "Prêt à commencer.";

  $("start").disabled = running || !total || elapsed >= total;
  $("pause").disabled = !running;
}

function renderTasks() {
  $("tasks").innerHTML = "";
  tasks.forEach((task, index) => {
    const row = document.createElement("div");
    row.className = "task";

    const swatch = document.createElement("div");
    swatch.className = "swatch";
    swatch.style.background = task.color;

    const name = document.createElement("div");
    name.className = "task-name";
    name.textContent = task.name;

    const duration = document.createElement("input");
    duration.type = "number";
    duration.min = "1";
    duration.max = "240";
    duration.value = task.minutes;
    duration.setAttribute("aria-label", "Durée de " + task.name);

    duration.addEventListener("change", () => {
      const value = Math.max(1, Math.min(240, Number(duration.value) || 1));
      task.minutes = value;
      duration.value = value;
      resetTimer();
      save();
      renderTasks();
      draw();
    });

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.textContent = "✕";
    remove.setAttribute("aria-label", "Supprimer " + task.name);
    remove.addEventListener("click", () => {
      tasks.splice(index, 1);
      resetTimer();
      save();
      renderTasks();
      draw();
    });

    row.append(swatch, name, duration, remove);
    $("tasks").appendChild(row);
  });
}

function stopTimer() {
  running = false;
  clearInterval(timer);
  timer = null;
}

function resetTimer() {
  stopTimer();
  elapsed = 0;
  lastTick = null;
}

function tick() {
  const now = Date.now();
  if (lastTick !== null) elapsed += (now - lastTick) / 1000;
  lastTick = now;

  if (elapsed >= totalSeconds()) {
    elapsed = totalSeconds();
    stopTimer();
  }
  draw();
}

$("add").addEventListener("click", () => {
  const name = $("newName").value.trim();
  const minutes = Number($("newDuration").value);
  if (!name) {
    alert("Écris le nom de l'activité.");
    return;
  }
  if (!Number.isInteger(minutes) || minutes < 1 || minutes > 240) {
    alert("Choisis une durée entre 1 et 240 minutes.");
    return;
  }
  tasks.push({
    name,
    minutes,
    color: $("newColor").value
  });
  resetTimer();
  save();
  renderTasks();
  draw();
  $("newName").value = "";
});

$("start").addEventListener("click", () => {
  if (running || !totalSeconds() || elapsed >= totalSeconds()) return;
  running = true;
  lastTick = Date.now();
  timer = setInterval(tick, 250);
  draw();
});

$("pause").addEventListener("click", () => {
  tick();
  stopTimer();
  draw();
});

$("reset").addEventListener("click", () => {
  resetTimer();
  draw();
});

renderTasks();
draw();
</script>
</body>
</html>
